name: release

# Manual: run from the Actions tab when main is ready to ship. The workflow
# bumps + tags, and the tag push triggers publish.yml.
on:
  workflow_dispatch:

# Needed to create tags, releases, and push the version-bump commit.
permissions:
  contents: write

# Only one release run at a time. If a second run is dispatched while a
# release is in progress, queue it — don't cancel. When the queued run starts
# it will find no unreleased commits (the tag was already created) and exit
# early.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history is required to find the previous release tag.
          fetch-depth: 0
          # RELEASE_TOKEN so the bump commit bypasses the PR ruleset and the
          # tag push triggers publish.yml (GITHUB_TOKEN pushes would not).
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release if there are unreleased changes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          chmod +x .github/scripts/release.sh .github/scripts/next-version.sh
          .github/scripts/release.sh
